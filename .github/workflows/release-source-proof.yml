name: Release source proof
run-name: Release source proof ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed Dev commit to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  python:
    name: Python syntax and unit tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify and record exact source SHA
        shell: bash
        env:
          OPENBRIDGE_CI_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ ! "$OPENBRIDGE_CI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected Source CI SHA is malformed."
            exit 1
          fi
          if [[ "$actual_sha" != "$OPENBRIDGE_CI_SOURCE_SHA" ]]; then
            echo "::error::Source CI checkout does not match the exact event source SHA."
            exit 1
          fi
          printf 'Exact Source CI SHA: `%s`\n' "$actual_sha" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Check syntax
        run: python -m py_compile openbridge_engine/*.py dictate.py engine_cli.py transcribe_video.py
      - name: Run unit tests
        run: make python-test

  swift:
    name: Swift compilation and source tests
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify and record exact source SHA
        shell: bash
        env:
          OPENBRIDGE_CI_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ ! "$OPENBRIDGE_CI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected Source CI SHA is malformed."
            exit 1
          fi
          if [[ "$actual_sha" != "$OPENBRIDGE_CI_SOURCE_SHA" ]]; then
            echo "::error::Source CI checkout does not match the exact event source SHA."
            exit 1
          fi
          printf 'Exact Source CI SHA: `%s`\n' "$actual_sha" >>"$GITHUB_STEP_SUMMARY"
      - name: Compile app
        run: swift build
      - name: Compile release and run source-level Swift checks
        run: make swift-check
