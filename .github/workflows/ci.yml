name: Source CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ["main"]

permissions:
  contents: read

# Draft updates do not allocate test runners. Returning to draft cancels stale PR work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Python syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify and record exact source SHA
        shell: bash
        env:
          OPENBRIDGE_CI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ ! "$OPENBRIDGE_CI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected Source CI SHA is malformed."
            exit 1
          fi
          if [[ "$actual_sha" != "$OPENBRIDGE_CI_SOURCE_SHA" ]]; then
            echo "::error::Source CI checkout does not match the exact event source SHA."
            exit 1
          fi
          printf 'Exact Source CI SHA: `%s`\n' "$actual_sha" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Check syntax
        run: python -m py_compile openbridge_engine/*.py dictate.py engine_cli.py transcribe_video.py
      - name: Run unit tests
        run: make python-test

  swift:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Swift compilation and source tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify and record exact source SHA
        shell: bash
        env:
          OPENBRIDGE_CI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ ! "$OPENBRIDGE_CI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected Source CI SHA is malformed."
            exit 1
          fi
          if [[ "$actual_sha" != "$OPENBRIDGE_CI_SOURCE_SHA" ]]; then
            echo "::error::Source CI checkout does not match the exact event source SHA."
            exit 1
          fi
          printf 'Exact Source CI SHA: `%s`\n' "$actual_sha" >>"$GITHUB_STEP_SUMMARY"
      - name: Compile app
        run: swift build
      - name: Compile release and run source-level Swift checks
        run: make swift-check
