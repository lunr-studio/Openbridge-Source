name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

# Draft updates do not allocate test runners. Returning to draft cancels stale PR work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Python CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        with:
          # GitHub Code Security uploads are unavailable while this repository
          # is private on the current organization plan. The analysis still
          # runs and produces SARIF; publication makes uploads available.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          upload-database: false
