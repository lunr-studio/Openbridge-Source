name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  python:
    name: Python CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        with:
          # GitHub Code Security uploads are unavailable while this repository
          # is private on the current organization plan. The analysis still
          # runs and produces SARIF; publication makes uploads available.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          upload-database: false
