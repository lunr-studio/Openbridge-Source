name: Public source boundary
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]
permissions:
  contents: read
# Draft updates do not allocate test runners. Returning to draft cancels stale PR work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  application-source:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Application source only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Verify the publication guard
        run: python -m unittest discover -s scripts/tests -p test_public_source_boundary.py -v
      - name: Reject excluded files in source and available history
        run: python scripts/check_public_source.py --history
